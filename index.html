<style>
:root{--blue:#1f6feb;--blue2:#e8f0fe;--ink:#1d2433;--sub:#667085;--line:#e4e7ec;--bg:#f4f6fa;--red:#d92d20;--green:#12825b;--orange:#c4570b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px}
button,input,select{font:inherit}
header{position:sticky;top:0;z-index:5;background:var(--blue);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
header .row{display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto}

header select{max-width:44vw;border:0;border-radius:10px;padding:7px 10px;background:rgba(255,255,255,.18);color:#fff}
header select option{color:#000}
@media (max-width:440px){ header h1{display:none} header select{flex:1;max-width:none;min-width:0} .iconbtn{padding:7px 9px} }

.bstop{border:2px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;background:#fff}

<script>
'use strict';
const LS_KEY = 'dongseon_v1';
const API = 'https://apis.openapi.sk.com/tmap';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };

// ---------- 기본 데이터 ----------
function seed() {
  const P = {
    manseon: {id:'manseon', name:'곤지암농협 만선지점', addr:'경기 광주시 곤지암읍 신만로 508', lat:37.36656842, lon:127.40429357},
    kyunghwa:{id:'kyunghwa', name:'경화여자고등학교', addr:'경기 광주시 수하길11번길 43', lat:37.419703, lon:127.263681},
    jubak:   {id:'jubak', name:'호법 주박리 159-5 (호법레포츠공원)', addr:'경기 이천시 호법면 동산로395번길 139-12', lat:37.216087, lon:127.408227},
    baeksa:  {id:'baeksa', name:'백사초등학교', addr:'경기 이천시 백사면 현방로 55', lat:37.338257, lon:127.49051},
  };
  const m = {"manseon|kyunghwa":[1864,16807,0],"manseon|jubak":[2611,21379,0],"manseon|baeksa":[1713,18597,0],"kyunghwa|manseon":[1900,17400,0],"kyunghwa|jubak":[2815,37797,1900],"kyunghwa|baeksa":[2461,29057,0],"jubak|manseon":[2915,28138,0],"jubak|kyunghwa":[3209,38059,1900],"jubak|baeksa":[2407,19067,0],"baeksa|manseon":[1655,18254,0],"baeksa|kyunghwa":[2453,28228,0],"baeksa|jubak":[2391,19290,0]};
  const cache = {};
  for (const k in m) cache[k] = {t:m[k][0], d:m[k][1], fare:m[k][2], src:'tmap', at:Date.now()};
  return {
    places: Object.values(P),
    plans: [{
      id:'p1', title:'경화여고 수령 + 백사초·주박리', date:'2026-10-16', startId:'manseon', endId:'', startTime:'09:00',
      stops:[
        {id:uid(), placeId:'kyunghwa', stay:5, fixed:'13:10', lock:true, memo:'물건 전달받기'},
        {id:uid(), placeId:'jubak', stay:0, fixed:'', lock:false, memo:''},
        {id:uid(), placeId:'baeksa', stay:0, fixed:'', lock:false, memo:''},
      ]
    }],
    cur:'p1', key:'', cache, manual:{}, routeOpt:'0'
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(LS_KEY)) || seed(); } catch(e) { S = seed(); }
S.manual = S.manual || {}; S.cache = S.cache || {}; S.routeOpt = S.routeOpt || '0';
S.dv = S.dv || {pass:'', data:null, tpl:null, localMap:{}, date:''}; S.dv.localMap = S.dv.localMap || {}; if (!S.dv.pass) { try { const bp = localStorage.getItem('drawbread_pass'); if (bp) S.dv.pass = bp; } catch(e){} }
const save = () => { localStorage.setItem(LS_KEY, JSON.stringify(S)); try { if (typeof syncWatch === 'function') syncWatch(); } catch(e){} };
save();

let tab = S.tab || 'plan';
{ const hz = (location.hash||'').slice(1); if (['delivery','cust','board','plan','places','settings'].includes(hz)) tab = hz; }
const isDraft = () => !!(S.viewDraft && S.draft);
const plan = () => isDraft() ? S.draft : (S.plans.find(p => p.id === S.cur) || S.plans[0]);
const HERE = '__here';
const place = id => S.places.find(p => p.id === id);
const pname = id => place(id)?.name || '(삭제된 장소)';

function toast(msg, ms=2600){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none', ms); }

// ---------- 시간 계산 ----------
const hm2min = s => { if(!s) return null; const [h,m]=s.split(':').map(Number); return h*60+m; };
const min2hm = v => { v = Math.round(v); const d = Math.floor(v/1440); v = ((v%1440)+1440)%1440; return (d>0?'+'+d+'일 ':'')+pad(Math.floor(v/60))+':'+pad(v%60); };
const durTxt = sec => { const m = Math.round(sec/60); return m>=60 ? Math.floor(m/60)+'시간 '+(m%60? (m%60)+'분':'') : m+'분'; };
const kmTxt = d => (d/1000).toFixed(1)+'km';

function legInfo(a, b) {
  const k = a+'|'+b;
  if (S.manual[k] != null) return {t:S.manual[k]*60, d:null, fare:0, src:'manual'};
  if (S.cache[k]) return S.cache[k];
  return null;
}
function endIdOf(p){ return p.endId || p.startId; }

// order: 배열(stop 객체). 반환: 일정
function schedule(p, order) {
  const oneWay = !!p.oneWay && order.length > 0;
  const pts = [p.startId, ...order.map(s => s.placeId), ...(oneWay ? [] : [endIdOf(p)])];
  const legs = [];
  for (let i=0;i<pts.length-1;i++) legs.push(legInfo(pts[i], pts[i+1]));
  const missing = legs.some(l => !l);
  const L = legs.map(l => l ? l.t/60 : 0);
  // 기준: 도착시각이 지정된 첫 번째 들를 곳
  let anchor = order.findIndex(s => s.fixed);
  let start;
  if (anchor >= 0) {
    let back = 0;
    for (let i=0;i<anchor;i++) back += L[i] + (order[i].stay||0);
    back += L[anchor];
    start = hm2min(order[anchor].fixed) - back;
  } else start = hm2min(p.startTime) ?? 9*60;
  const rows = []; let t = start, late = 0, wait = 0;
  for (let i=0;i<order.length;i++) {
    t += L[i];
    const s = order[i]; let arr = t, w = 0, lt = 0;
    if (s.fixed) { const f = hm2min(s.fixed); if (arr < f - 0.5) { w = f - arr; t = f; } else if (arr > f + 0.5) lt = arr - f; }
    wait += w; late += lt;
    rows.push({stop:s, arr, wait:w, late:lt, dep: t + (s.stay||0)});
    t += (s.stay||0);
  }
  if (!oneWay) t += L[order.length];
  const dist = legs.reduce((a,l)=>a+(l&&l.d||0),0), fare = legs.reduce((a,l)=>a+(l&&l.fare||0),0);
  const drive = L.reduce((a,b)=>a+b,0);
  return {pts, legs, missing, start, end:t, rows, late, wait, dist, fare, drive, total:t-start};
}

function* perms(arr){ if(arr.length<=1){ yield arr.slice(); return; } for(let i=0;i<arr.length;i++){ const r=arr.slice(0,i).concat(arr.slice(i+1)); for(const q of perms(r)) yield [arr[i],...q]; } }
function bestOrder(p) {
  const fixedPos = p.stops.map((s,i)=>s.lock?i:-1).filter(i=>i>=0);
  const free = p.stops.filter(s=>!s.lock);
  const slots = p.stops.map((s,i)=>s.lock?null:i).filter(i=>i!==null);
  let best=null;
  for (const pm of perms(free)) {
    const order = p.stops.slice();
    slots.forEach((pos,j)=>order[pos]=pm[j]);
    const sc = schedule(p, order);
    if (sc.missing) continue;
    const cost = sc.total + sc.late*1000;
    if (!best || cost < best.cost - 0.01) best = {order, sc, cost};
  }
  return best;
}

// ---------- TMAP 연결 ----------
async function tmapFetch(path, opt={}) {
  if (!S.key) throw new Error('NOKEY');
  const r = await fetch(API+path, {...opt, headers:{appKey:S.key, Accept:'application/json', 'Content-Type':'application/json', ...(opt.headers||{})}});
  const txt = await r.text();
  if (!r.ok) { let m=''; try{ m = JSON.parse(txt).error?.message || ''; }catch(e){} throw new Error('TMAP '+r.status+' '+m); }
  return txt ? JSON.parse(txt) : {};
}
function isoKST(dateStr, minutes){
  const base = new Date(dateStr+'T00:00:00+09:00'); base.setMinutes(base.getMinutes()+Math.round(minutes));
  const k = new Date(base.getTime()+9*3600e3);
  return k.toISOString().slice(0,19)+'+0900';
}
async function routeTime(a, b, whenISO) {
  const A = place(a), B = place(b);
  if (!A?.lat || !B?.lat) throw new Error('좌표 없음');
  // 1순위: 시간 지정 예측(타임머신)
  if (whenISO && new Date(whenISO.replace('+0900','+09:00')) > new Date()) {
    try {
      const body = {routesInfo:{departure:{name:A.name.slice(0,30),lon:String(A.lon),lat:String(A.lat)},destination:{name:B.name.slice(0,30),lon:String(B.lon),lat:String(B.lat)},predictionType:'arrival',predictionTime:whenISO,searchOption:S.routeOpt==='0'?'00':pad(+S.routeOpt)}};
      const j = await tmapFetch('/routes/prediction?version=1&reqCoordType=WGS84GEO&resCoordType=WGS84GEO&totalValue=2', {method:'POST', body:JSON.stringify(body)});
      const pr = j.features[0].properties;
      return {t:pr.totalTime, d:pr.totalDistance, fare:pr.totalFare||0, src:'tmap', at:Date.now()};
    } catch(e) { if (String(e.message).includes('NOKEY')) throw e; }
  }
  // 2순위: 지금 교통 기준
  const body = {startX:String(A.lon),startY:String(A.lat),endX:String(B.lon),endY:String(B.lat),reqCoordType:'WGS84GEO',resCoordType:'WGS84GEO',searchOption:S.routeOpt,startName:A.name.slice(0,30),endName:B.name.slice(0,30)};
  const j = await tmapFetch('/routes?version=1&totalValue=2', {method:'POST', body:JSON.stringify(body)});
  const pr = j.features[0].properties;
  return {t:pr.totalTime, d:pr.totalDistance, fare:pr.totalFare||0, src:'tmap', at:Date.now()};
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

// 들를 곳 사이 모든 구간 시간 채우기
async function fillMatrix(p, force=false, onProg) {
  const ids = [...new Set([p.startId, endIdOf(p), ...p.stops.map(s=>s.placeId)])];
  const sc = schedule(p, p.stops);
  const when = isFinite(sc.start) ? isoKST(p.date, sc.start + 30) : null;
  const need = [];
  for (const a of ids) for (const b of ids) if (a!==b) {
    if (a===endIdOf(p) && a!==p.startId) continue;
    if (b===p.startId && b!==endIdOf(p)) continue;
    if (!place(a)?.lat || !place(b)?.lat) continue;
    if (force || !S.cache[a+'|'+b]) need.push([a,b]);
  }
  let n=0;
  for (const [a,b] of need) {
    onProg && onProg(++n, need.length);
    S.cache[a+'|'+b] = await routeTime(a,b,when);
    await sleep(120);
  }
  save();
  return need.length;
}
// 정해진 순서대로 실제 시간대에 맞춰 다시 계산
async function refineOrder(p, onProg) {
  let prevStart = null;
  for (let round=0; round<2; round++) {
    const sc = schedule(p, p.stops);
    if (sc.missing) return;
    if (prevStart != null && Math.abs(sc.start - prevStart) < 2) break;
    prevStart = sc.start;
    for (let i=0;i<sc.pts.length-1;i++) {
      onProg && onProg(i+1, sc.pts.length-1);
      const a=sc.pts[i], b=sc.pts[i+1];
      if (S.manual[a+'|'+b]!=null) continue;
      const depMin = i===0 ? sc.start : sc.rows[i-1].dep;
      if (!place(a)?.lat || !place(b)?.lat) continue;
      S.cache[a+'|'+b] = await routeTime(a,b,isoKST(p.date,depMin));
      await sleep(120);
    }
  }
  save();
}

// ---------- 화면: 동선 ----------
function renderPlanSel(){
  $('#planSel').innerHTML = (S.draft?`<option value="__draft" ${isDraft()?'selected':''}>🔎 새 길찾기 (저장 안 됨)</option>`:'')
    + S.plans.map(p=>`<option value="${p.id}" ${!isDraft()&&p.id===S.cur?'selected':''}>${esc(p.title)}</option>`).join('');
}

// ---------- 새 길찾기 (저장 전 임시 동선) ----------
function usedInPlans(id){ return S.plans.some(p=>p.startId===id||p.endId===id||p.stops.some(s=>s.placeId===id)); }
function discardTempPlaces(){ S.places = S.places.filter(P => !P.temp || P.id===HERE || usedInPlans(P.id)); }
function startDraft(){
  if (S.draft) {
    if (!confirm('작성 중인 새 길찾기가 있어요.\n[확인] 새로 시작 / [취소] 작성 중인 것 이어서 보기')) { S.viewDraft = true; save(); tab='plan'; render(); return; }
    S.draft = null; discardTempPlaces();
  }
  const base = S.plans.find(p=>p.id===S.cur);
  const now = new Date(); now.setMinutes(now.getMinutes() + 5 - now.getMinutes()%5);
  S.draft = {id:'draft', title:'', date:todayStr(), startId: base?.startId || S.places.find(P=>!P.temp)?.id || '', endId:'', startTime: pad(now.getHours())+':'+pad(now.getMinutes()), stops:[], searched:false};
  S.viewDraft = true; save(); tab='plan'; render(); window.scrollTo(0,0);
  addDestination();
}
function addDestination(){
  pickPlace('목적지 입력', async id => {
    const p = plan();
    p.stops.push({id:uid(), placeId:id, stay:0, fixed:'', lock:false, memo:''});
    if (isDraft()) p.searched = false;
    save(); render();
    if (S.key) await findRoute();
  });
}
async function findRoute(){
  const p = plan();
  if (!p.stops.length) { toast('목적지를 먼저 넣어 주세요'); return; }
  if (p.stops.filter(s=>!s.lock).length >= 2) { await doOptimize(true); }
  else {
    if (S.key) { const ok = await ensureTimes(false); if (!ok) return; }
    else if (schedule(p,p.stops).missing) { toast('티맵 연결 키가 없어서 시간을 못 받아요. 설정에서 키를 넣거나 구간 시간을 직접 입력해 주세요', 4500); return; }
  }
  const sc = schedule(p,p.stops);
  if (!sc.missing) { p.searched = true; save(); render(); toast(`길 찾기 완료! ${min2hm(sc.end)} 도착 예상 (총 ${durTxt(sc.total*60)})`, 4000); }
}
function autoName(p){
  const n = p.stops.length; const first = n ? pname(p.stops[0].placeId) : '새 동선';
  return p.date.slice(5).replace('-','/') + ' ' + first + (n>1 ? ` 외 ${n-1}곳` : '');
}
function saveDraft(){
  const p = S.draft; if (!p) return;
  if (!p.stops.length) { toast('목적지를 먼저 넣어 주세요'); return; }
  openSheet(`<h2>동선으로 저장</h2>
    <div class="muted">저장하면 위쪽 동선 목록에 남아서 나중에 다시 불러올 수 있어요.</div>
    <label class="f">이름 (그대로 두어도 돼요)</label><input class="inp" id="dn" value="${esc(autoName(p))}">
    <div class="row" style="margin-top:14px"><button class="btn ghost grow" id="dc">취소</button><button class="btn primary grow" id="ds">저장</button></div>`);
  $('#dc').onclick = closeSheet;
  $('#ds').onclick = () => {
    const np = JSON.parse(JSON.stringify(p)); np.id = uid(); np.title = $('#dn').value.trim() || autoName(p); delete np.searched;
    S.plans.push(np); S.cur = np.id;
    [np.startId, np.endId, ...np.stops.map(s=>s.placeId)].forEach(id => { const P = place(id); if (P && P.id!==HERE) delete P.temp; });
    S.draft = null; S.viewDraft = false; save(); closeSheet(); render(); toast('동선으로 저장했어요');
  };
}
function closeDraft(){
  if (!confirm('저장하지 않고 닫을까요?\n(조회한 내용은 사라져요)')) return;
  S.draft = null; S.viewDraft = false; discardTempPlaces(); save(); closeSheet(); render(); toast('닫았어요. 저장된 동선은 그대로예요');
}
function useHere(cb){
  if (!navigator.geolocation) { toast('이 휴대폰에서는 위치 기능을 쓸 수 없어요'); return; }
  toast('현재 위치 확인 중…', 8000);
  navigator.geolocation.getCurrentPosition(pos => {
    let P = place(HERE); if (!P) { P = {id:HERE, name:'현재 위치', addr:'', lat:0, lon:0, temp:true}; S.places.push(P); }
    P.lat = pos.coords.latitude; P.lon = pos.coords.longitude; P.addr = '지금 있는 곳 (' + new Date().toTimeString().slice(0,5) + ' 기준)';
    for (const k in S.cache) if (k.split('|').includes(HERE)) delete S.cache[k];
    save(); toast('현재 위치를 찾았어요'); cb(HERE);
  }, () => toast('위치를 가져오지 못했어요. 휴대폰 위치 권한을 확인해 주세요', 4500), {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
}
function navLinks(id){
  const P = place(id); if (!P) return '';
  const n = encodeURIComponent(P.name);
  if (P.lat) return `<a class="navbtn tmap" href="tmap://route?goalname=${n}&goalx=${P.lon}&goaly=${P.lat}">티맵</a><a class="navbtn kakao" href="https://map.kakao.com/link/to/${n},${P.lat},${P.lon}" target="_blank" rel="noopener">카카오</a>`;
  return `<a class="navbtn kakao" href="https://map.kakao.com/link/search/${encodeURIComponent(P.addr||P.name)}" target="_blank" rel="noopener">지도 검색</a>`;
}
function renderPlan(){
  const p = plan(); if (!p) { $('#main').innerHTML = '<div class="empty">저장된 동선이 없어요.<br>위쪽 <b>＋ 길찾기</b>를 눌러 목적지부터 넣어 보세요.</div>'; $('#barActions').innerHTML = `<button class="btn primary grow" data-act="newDraft">＋ 새 길찾기</button>`; return; }
  const sc = schedule(p, p.stops);
  const hasFixed = p.stops.some(s=>s.fixed);

      <div class="muted" style="margin-top:4px;line-height:1.5">${!p.stops.length ? '가야 할 목적지를 넣어 주세요. 여러 곳이면 하나씩 추가하면 돼요.' : (p.searched ? '길 찾기 결과예요. 바로 가려면 <b>티맵</b> 버튼, 계속 쓸 동선이면 <b>저장</b>, 조회만 했으면 <b>닫기</b>를 눌러 주세요.' : '목적지를 다 넣었으면 아래 <b>길 찾기</b>를 눌러 주세요.')}</div></div>`;

  h += hasFixed ? `<div class="grow"><label class="f" style="margin-top:0">출발 시각</label><div class="inp" style="background:#f8fafc">${isFinite(sc.start)&&!sc.missing?min2hm(sc.start):'-'} <span class="muted">(약속 시간에 맞춤)</span></div></div>`

  h += `<div class="card"><div class="stop"><div class="dot home">출발</div><div class="grow">

    h += legHtml(i);

    h += `<div class="card"><div class="stop"><div class="dot">${i+1}</div><div class="grow">
      <div class="row"><div class="grow"><div class="name">${esc(pname(s.placeId))}</div><div class="muted">${esc(place(s.placeId)?.addr||'')}</div></div>

      <div>
      </div>
      <div class="acts">
        <button class="btn sm ghost" data-act="up" data-i="${i}" ${i===0?'disabled':''}>▲</button>

    <div class="acts"><button class="btn sm ghost" data-act="pickEnd">도착 방법 바꾸기</button></div></div></div></div>`;
  else {
  h += legHtml(p.stops.length);
  h += `<div class="card"><div class="stop"><div class="dot home">도착</div><div class="grow">
    <div class="row"><div class="grow"><div class="name">${esc(pname(endIdOf(p)))}</div><div class="muted">${p.endId?'다른 곳에서 마침':'출발지로 돌아오기'}</div></div>

  const ps = $('#pStart'); if (ps) ps.onchange = e => { p.startTime = e.target.value; save(); render(); };
}

function render(){
  renderPlanSel();
  if (S.tab !== tab) { S.tab = tab; save(); }
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  if (tab==='plan') renderPlan(); else if (tab==='places') renderPlaces(); else if (tab==='delivery') renderDelivery(); else if (tab==='cust') renderCust(); else if (tab==='board') renderBoard(); else renderSettings();

// ================= 배송 코스 (이카운트 판매전표 기준) =================
const DV = {state:'idle', enc:null, msg:''};
const WD = '일월화수목금토';
const wdOf = d => new Date(d+'T00:00:00').getDay();
const md = d => d.slice(5).replace('-','/') + '(' + WD[wdOf(d)] + ')';
const addDays = (d,n) => { const x = new Date(d+'T00:00:00'); x.setDate(x.getDate()+n); return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()); };

async function dvDecrypt(enc, pass){

}
async function dvLoad(){

    DV.enc = await r.json();

  if (!S.dv.pass) { DV.state = 'needpass'; return; }
  try { S.dv.data = await dvDecrypt(DV.enc, S.dv.pass); dvSyncPlaces(); save(); DV.state = 'ok'; }
  catch(e) { DV.state = 'needpass'; DV.msg = '암호가 맞지 않아요'; S.dv.pass = ''; save(); }
}
function dvSyncPlaces(){
  const d = S.dv.data; if (!d) return;
  for (const m of d.places) {
    const id = 'dv_'+m.id; let P = place(id);
    if (!P) { P = {id}; S.places.push(P); }
    if (P.userEdited) { Object.assign(P, {ecount:m.ecount, alias:m.alias, dv:true, n:m.n||0, last:m.last||'', region:m.region||''}); continue; }
    Object.assign(P, {name: m.depot ? '빵을그리다 (출발·복귀)' : m.short, addr: m.addr || '(주소 확인 필요)', lat: m.lat, lon: m.lon, dv:true, ecount:m.ecount, ecountAlt:m.ecountAlt||[], alias:m.alias, note:m.note, conf:m.conf, n:m.n||0, last:m.last||'', region:m.region||''});

}
const dvDepot = () => 'dv_depot';
function custPlace(c){ const d = S.dv.data; const id = S.dv.localMap[c] || (d?.custMap?.[c] ? 'dv_'+d.custMap[c] : null); return id && place(id) ? id : null; }
function dvTpl(wd){
  if (S.dv.tpl && S.dv.tpl[wd]) return S.dv.tpl[wd];
  return (S.dv.data?.template?.[wd] || []).map(r => ({run:r.run, ids:r.ids.map(i=>'dv_'+i)}));
}
function weekRange(D){ const w = wdOf(D); const mon = addDays(D, w===0 ? -6 : 1-w); return [mon, addDays(mon,6)]; }
// 그 주(월~일) 이카운트 판매전표 업체별 묶음
function weekCusts(D){
  const [a,b] = weekRange(D); const out = {};
  const slips = S.dv.data?.slips || {};
  for (const d of Object.keys(slips).sort()) { if (d < a || d > b) continue;
    for (const [c, items] of Object.entries(slips[d])) { const o = out[c] ||= {cust:c, dates:[], items:[], placeId:custPlace(c)}; if (!o.dates.includes(d)) o.dates.push(d); items.forEach(it=>o.items.push([it[0], it[1], d])); }

}
const dvPlans = D => S.plans.filter(p => p.kind==='dv' && p.dvDate===D);
function itemsFor(placeId, D){ const wk = weekCusts(D); const hit = Object.values(wk).filter(o=>o.placeId===placeId); return hit.flatMap(o=>o.items); }
function newDvPlan(D, run, stops){
  if (S.dv.sig && S.dv.sig[D] === undefined) S.dv.sig[D] = '__new';
  const p = {id:uid(), kind:'dv', dvDate:D, run, title:`${md(D)} ${run} 배송`, date:D, startId:dvDepot(), endId:'', startTime: /오후/.test(run) ? '13:00' : '08:30', stops: stops||[]};

function dvMakeDefault(D){
  const wk = weekCusts(D); const byPlace = {};

  const tpl = dvTpl(String(wdOf(D)));
  if (!tpl.length) { newDvPlan(D, '배송', []); return 0; }
  let n = 0;
  for (const r of tpl) {
    const stops = r.ids.filter(id=>place(id)).map(id => ({id:uid(), placeId:id, stay:10, fixed:'', lock:false, memo:'', items: byPlace[id]||[], noSlip: !byPlace[id]}));

// ================= 공유 저장 (구글 시트 · 모든 기기 같은 코스·체크) =================
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbyicz3BGmhiCkS17yozBKvsy4jMaGjazpMiymhmF0DQPb2fhLLII5VMwvWrrkqHd14J/exec';
const SY = {state:'off', at:0, timer:null, pushT:{}, pulling:{}, err:''};
S.dv.sig = S.dv.sig || {}; S.dv.chk = S.dv.chk || {}; S.dv.dayAt = S.dv.dayAt || {};
async function syncToken(){
  if (!S.dv.pass) return null;
  if (S.dv.tokFor === S.dv.pass && S.dv.tok) return S.dv.tok;
  const h = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('dongseon|'+S.dv.pass)))).map(b=>b.toString(16).padStart(2,'0')).join('');
  S.dv.tok = h; S.dv.tokFor = S.dv.pass; localStorage.setItem(LS_KEY, JSON.stringify(S)); return h;
}
async function syncCall(body){
  const token = await syncToken(); if (!token) throw new Error('암호 없음');
  const r = await fetch(SYNC_URL, {method:'POST', body: JSON.stringify({...body, token, by: S.dv.who || '이름 없는 기기'})});
  const j = await r.json(); if (!j.ok) throw new Error(j.err || '실패'); return j;
}
const syncPut = (key, value) => syncCall({op:'put', key, value}).then(j => { SY.state='ok'; SY.at=Date.now(); return j; }).catch(e => { SY.state='err'; SY.err=e.message; });
const syncMerge = (key, value) => syncCall({op:'merge', key, value}).then(j => { SY.state='ok'; SY.at=Date.now(); return j; }).catch(e => { SY.state='err'; SY.err=e.message; });
function syncBadge(){
  const t = SY.at ? new Date(SY.at).toTimeString().slice(0,5) : '';
  if (SY.state==='ok') return `<span class="syncdot"></span>모든 기기와 공유 중 · ${t} 맞춤${S.dv.who?` · 이 기기: ${esc(S.dv.who)}`:` · <a href="#" data-act="setWho">이 기기 이름 정하기</a>`}`;
  if (SY.state==='err') return `<span class="syncdot err"></span>공유 연결 안 됨 (${esc(SY.err)}) · 인터넷 확인`;
  return `<span class="syncdot off"></span>공유 연결 중…`;
}
// 배송 코스(날짜별) → 공유용 모양
function daySig(D){ return JSON.stringify(dvPlans(D).map(p=>({id:p.id, run:p.run, startTime:p.startTime, oneWay:!!p.oneWay, endId:p.endId||'', stops:p.stops.map(s=>({id:s.id, placeId:s.placeId, name:pname(s.placeId), stay:s.stay, fixed:s.fixed||'', lock:!!s.lock, memo:s.memo||'', items:s.items||[], noSlip:!!s.noSlip}))}))); }
// save()마다: 바뀐 날짜 코스만 1.2초 뒤 올리기
function syncWatch(){
  if (!S.dv || !S.dv.pass || !S.dv.data) return;
  const dates = new Set([...S.plans.filter(p=>p.kind==='dv').map(p=>p.dvDate), ...Object.keys(S.dv.sig)]);
  for (const D of dates) {
    if (S.dv.sig[D] === undefined) continue;
    const sig = daySig(D); if (S.dv.sig[D] === sig) continue;
    clearTimeout(SY.pushT[D]);
    SY.pushT[D] = setTimeout(async () => {
      const sig2 = daySig(D); if (S.dv.sig[D] === sig2) return;
      const runs = JSON.parse(sig2);
      const j = await syncPut('day:'+D, {runs});
      if (j && j.ok) { S.dv.sig[D] = sig2; S.dv.dayAt[D] = j.at; localStorage.setItem(LS_KEY, JSON.stringify(S)); if (tab==='delivery'||tab==='board') { const b = document.querySelector('.syncline'); } }
    }, 1200);
  }
}
function applyDay(D, runs){
  S.plans = S.plans.filter(p => !(p.kind==='dv' && p.dvDate===D));
  for (const r of runs) {
    for (const s of r.stops) if (!place(s.placeId)) S.places.push({id:s.placeId, name:s.name||'(알 수 없음)', addr:'(주소 확인 필요)', lat:null, lon:null, dv:true});
    S.plans.push({id:r.id, kind:'dv', dvDate:D, run:r.run, title:`${md(D)} ${r.run} 배송`, date:D, startId:dvDepot(), endId:r.endId||'', oneWay:!!r.oneWay, startTime:r.startTime||'08:30',
      stops:r.stops.map(s=>({id:s.id||uid(), placeId:s.placeId, stay:s.stay??10, fixed:s.fixed||'', lock:!!s.lock, memo:s.memo||'', items:s.items||[], noSlip:!!s.noSlip}))});

}
async function syncPull(D, force){

  SY.pulling[D] = true; SY.lastPull = Date.now(); SY.lastPullD = D;

    const j = await syncCall({op:'get', keys:['day:'+D, 'chk:'+D, 'tpl', 'places', 'cmap'].join(',')});
    SY.state = 'ok'; SY.at = Date.now();
    const d = j.data || {}; let changed = false;
    const dirty = S.dv.sig[D] !== undefined && S.dv.sig[D] !== daySig(D);
    if (d['day:'+D] && d['day:'+D].value) {
      if (!dirty && d['day:'+D].at !== S.dv.dayAt[D]) { const before = daySig(D); applyDay(D, d['day:'+D].value.runs||[]); S.dv.dayAt[D] = d['day:'+D].at; changed = changed || before !== S.dv.sig[D]; }
    } else if (dvPlans(D).length && !dirty) { S.dv.sig[D] = '__'; syncWatch(); }

    for (const [id, v] of Object.entries(d.places?.value || {})) { let P = place(id); if (!P) { P = {id, dv:true}; S.places.push(P); } const nv = {name:v.name, addr:v.addr, lat:v.lat, lon:v.lon, ecount:v.ecount||P.ecount, alias:v.alias||P.alias, dv:true, userEdited:true}; if (JSON.stringify([P.name,P.addr,P.lat,P.lon]) !== JSON.stringify([nv.name,nv.addr,nv.lat,nv.lon])) { Object.assign(P, nv); changed = true; } }

  finally { SY.pulling[D] = false; }
}
function syncPlace(id, cust){
  const P = place(id); if (!P) return;
  syncMerge('places', {[id]: {name:P.name, addr:P.addr, lat:P.lat??null, lon:P.lon??null, ecount:P.ecount||cust||'', alias:P.alias||[]}});
  if (cust) syncMerge('cmap', {[cust]: id});

function chkSet(D, path, val){
  const ck = S.dv.chk[D] = S.dv.chk[D] || {};

function dvQuery(q, D){

  const hits = S.places.filter(P => P.dv && !/depot/.test(P.id) && [P.name, P.ecount, ...(P.alias||[])].some(x => norm(x).includes(qn) || (qn.length>=2 && qn.includes(norm(x)) && norm(x).length>=2)));
  const allCust = new Set(); Object.values(S.dv.data.slips).forEach(o => Object.keys(o).forEach(c => allCust.add(c)));
  const custHits = [...allCust].filter(c => !custPlace(c) && norm(c).includes(qn)).slice(0,6);
  box.innerHTML = `<div class="list">${hits.map(P=>`<div class="it"><div class="grow"><div class="name" style="font-size:15.5px">${esc(P.name)}</div><div class="muted">${esc(P.addr)}</div></div><button class="btn sm primary" data-act="dvAddPlace" data-pid="${P.id}">넣기</button></div>`).join('')}
    ${custHits.map(c=>`<div class="it"><div class="grow"><div class="name" style="font-size:15.5px">${esc(c)}</div><div class="muted">이카운트 거래처 · 주소 미등록</div></div><button class="btn sm ghost" data-act="dvReg" data-cust="${esc(c)}">배송처 등록</button></div>`).join('')}
    ${!hits.length && !custHits.length ? `<div class="it"><div class="grow muted">맞는 업체가 없어요</div><button class="btn sm ghost" data-act="dvReg" data-cust="${esc(q)}">새 배송처 등록</button></div>`:''}</div>`;
}

  const box = $('#sres');

    box.innerHTML = `<div class="warn" style="margin-top:10px">티맵 연결 키가 없어서 검색을 못 해요. 이름과 주소만 저장할 수 있어요 (이 경우 시간은 직접 입력).</div><button class="btn" style="width:100%" id="manualAdd">‘${esc(q)}’ 이름으로 저장</button>`;
    $('#manualAdd').onclick = () => { const P={id:uid(),name:q,addr:q,lat:null,lon:null,temp:isDraft()||undefined}; S.places.push(P); save(); closeSheet(); onPick(P.id); };
    return;
  }
  box.innerHTML = '<div class="muted" style="padding:12px"><span class="spin"></span> 티맵에서 찾는 중…</div>';
  try {
    let items = [];
    try {
      const j = await tmapFetch(`/pois?version=1&count=15&resCoordType=WGS84GEO&searchKeyword=${encodeURIComponent(q)}`, {headers:{'Content-Type':'text/plain'}});
      items = (j?.searchPoiInfo?.pois?.poi||[]).map(p=>({name:p.name, addr:(p.newAddressList?.newAddress?.[0]?.fullAddressRoad) || [p.upperAddrName,p.middleAddrName,p.lowerAddrName,p.detailAddrName,p.firstNo&&p.firstNo!=='0'?p.firstNo+(p.secondNo&&p.secondNo!=='0'?'-'+p.secondNo:''):''].filter(Boolean).join(' '), lat:+(p.frontLat||p.noorLat), lon:+(p.frontLon||p.noorLon)}));
    } catch(e){ if(!String(e.message).includes('204')) console.warn(e); }
    if (/\d/.test(q)) {
      try {
        const g = await tmapFetch(`/geo/fullAddrGeo?version=1&coordType=WGS84GEO&fullAddr=${encodeURIComponent(q)}`, {headers:{'Content-Type':'text/plain'}});
        const c = g?.coordinateInfo?.coordinate?.[0];
        if (c) { const lat=+(c.newLatEntr||c.newLat||c.latEntr||c.lat), lon=+(c.newLonEntr||c.newLon||c.lonEntr||c.lon); if (lat) items.unshift({name:q, addr:q+' (주소 위치)', lat, lon}); }
      } catch(e){}
    }
    if (!items.length) { box.innerHTML = '<div class="empty">검색 결과가 없어요. 다른 이름이나 도로명 주소로 찾아보세요.</div>'; return; }
    box.innerHTML = `<div class="muted" style="margin:10px 0 2px">티맵 검색 결과</div><div class="list">${items.map((it,i)=>`<div class="it" data-new="${i}" style="cursor:pointer"><div class="grow"><div class="name" style="font-size:16px">${esc(it.name)}</div><div class="muted">${esc(it.addr)}</div></div><span class="btn sm primary">추가</span></div>`).join('')}</div>`;
    box.querySelectorAll('[data-new]').forEach(el=>el.onclick=()=>{
      const it = items[+el.dataset.new]; const P = {id:uid(), ...it}; if (isDraft()) P.temp = true; S.places.push(P); save(); closeSheet(); toast('장소를 저장했어요'); onPick(P.id);
    });
  } catch(e) { box.innerHTML = `<div class="warn" style="margin-top:10px">검색 중 문제가 생겼어요. 설정에서 키가 맞는지 확인해 주세요. (${esc(e.message)})</div>`; }
}

function editStop(i, isNew){
  const p = plan();
  const s = isNew ? {id:uid(), placeId:null, stay:0, fixed:'', lock:false, memo:''} : {...p.stops[i]};
  const draw = () => openSheet(`<h2>${isNew?'들를 곳 추가':'들를 곳 수정'}</h2>
    <label class="f">장소</label>
    <button class="inp" id="sp" style="text-align:left">${s.placeId?esc(pname(s.placeId)):'<span class="muted">눌러서 장소 고르기</span>'}</button>
    <label class="f">머무는 시간</label>
    <div class="chips">${[0,5,10,15,20,30,60].map(v=>`<button class="chip ${s.stay===v?'on':''}" data-stay="${v}">${v?v+'분':'바로 출발'}</button>`).join('')}
      <input type="number" min="0" class="inp" id="stayIn" style="width:90px" value="${s.stay}" inputmode="numeric"> <span class="muted" style="align-self:center">분</span></div>
    <label class="f">도착 약속 시간 (있을 때만)</label>
    <div class="row"><input type="time" class="inp grow" id="fx" value="${esc(s.fixed)}"><button class="btn ghost" id="fxClr">없음</button></div>
    <div class="switch"><div><b>순서 고정</b><div class="muted">‘최적 순서 찾기’를 해도 이 자리는 그대로</div></div><input type="checkbox" id="lk" ${s.lock?'checked':''} style="width:24px;height:24px"></div>
    <label class="f">메모</label><input class="inp" id="mm" value="${esc(s.memo)}" placeholder="예: 물건 받기">
    <div class="row" style="margin-top:14px"><button class="btn ghost grow" id="cc">취소</button><button class="btn primary grow" id="ok">${isNew?'추가':'저장'}</button></div>`);
  const bind = () => {
    $('#sp').onclick = () => { collect(); pickPlace('장소 고르기', id => { s.placeId = id; draw(); bind(); }); };
    $('#sheet').querySelectorAll('[data-stay]').forEach(b=>b.onclick=()=>{ collect(); s.stay=+b.dataset.stay; draw(); bind(); });
    $('#fxClr').onclick = () => { $('#fx').value=''; };
    $('#cc').onclick = closeSheet;
    $('#ok').onclick = async () => {
      collect();
      if (!s.placeId) { toast('장소를 골라 주세요'); return; }
      if (isNew) p.stops.push(s); else p.stops[i] = s;
      save(); closeSheet(); render();
      if (S.key) await ensureTimes(false);
    };
  };
  const collect = () => { const el=$('#stayIn'); if(!el) return; s.stay = Math.max(0, +el.value||0); s.fixed=$('#fx').value||''; s.lock=$('#lk').checked; s.memo=$('#mm').value.trim(); };
  draw(); bind();
}

function editPlace(id){
  const P = id ? {...place(id)} : null;
  if (!P) { pickPlace('새 장소 찾기', ()=>render()); return; }
  openSheet(`<h2>장소 수정</h2>
    <label class="f">이름</label><input class="inp" id="pn" value="${esc(P.name)}">
    <label class="f">주소 (메모용)</label><input class="inp" id="pa" value="${esc(P.addr||'')}">
    <div class="row" style="margin-top:8px"><div class="muted grow" id="pll">${P.lat?'위치: '+P.lat.toFixed(5)+', '+P.lon.toFixed(5):'위치 정보 없음'}</div><button class="btn sm" id="pgeo">주소로 위치 찾기</button></div>
    ${P.ecount?`<div class="muted" style="margin-top:6px">이카운트 거래처명: ${esc(P.ecount)}</div>`:''}${P.note?`<div class="muted" style="margin-top:4px">참고: ${esc(P.note)}</div>`:''}
    <div class="row" style="margin-top:14px"><button class="btn danger" id="pd">삭제</button><button class="btn ghost grow" id="pc">취소</button><button class="btn primary grow" id="ps">저장</button></div>`);
  $('#pc').onclick = closeSheet;
  let newLL = null;
  $('#pgeo').onclick = async () => {
    if (!S.key) { toast('설정에서 티맵 연결 키를 먼저 넣어 주세요'); return; }
    const q = $('#pa').value.trim(); if (!q) { toast('주소를 먼저 입력해 주세요'); return; }
    $('#pll').innerHTML = '<span class="spin"></span> 찾는 중…';
    try {
      const g = await tmapFetch(`/geo/fullAddrGeo?version=1&coordType=WGS84GEO&fullAddr=${encodeURIComponent(q)}`, {headers:{'Content-Type':'text/plain'}});
      const c = g?.coordinateInfo?.coordinate?.[0]; const lat=+(c?.newLatEntr||c?.newLat||c?.latEntr||c?.lat), lon=+(c?.newLonEntr||c?.newLon||c?.lonEntr||c?.lon);
      if (!lat) throw new Error('못 찾음'); newLL = {lat, lon}; $('#pll').textContent = '새 위치: '+lat.toFixed(5)+', '+lon.toFixed(5)+' (저장을 눌러야 반영)';
    } catch(e) { $('#pll').textContent = '위치를 못 찾았어요. 도로명 주소로 다시 입력해 보세요'; }
  };
  $('#ps').onclick = () => { const o=place(id); o.name=$('#pn').value.trim()||o.name; o.addr=$('#pa').value.trim(); if (newLL) { o.lat=newLL.lat; o.lon=newLL.lon; for (const k in S.cache) if (k.split('|').includes(id)) delete S.cache[k]; } o.userEdited = true; save(); if (o.dv) syncPlace(id); closeSheet(); render(); };
  $('#pd').onclick = () => {
    const used = S.plans.some(p=>p.startId===id||p.endId===id||p.stops.some(s=>s.placeId===id));
    if (used && !confirm('이 장소를 쓰는 동선이 있어요. 그래도 삭제할까요? (그 동선에서도 빠져요)')) return;
    if (!used && !confirm('이 장소를 삭제할까요?')) return;
    S.places = S.places.filter(x=>x.id!==id);
    S.plans.forEach(p=>{ p.stops = p.stops.filter(s=>s.placeId!==id); if(p.endId===id) p.endId=''; });
    save(); closeSheet(); render();
  };
}

function editLeg(a,b){
  const cur = legInfo(a,b);
  const v = prompt(`${pname(a)} → ${pname(b)}\n걸리는 시간(분)을 직접 입력하세요.\n비우면 직접 입력을 지우고 티맵 값을 써요.`, S.manual[a+'|'+b] ?? (cur?Math.round(cur.t/60):''));
  if (v===null) return;
  if (v.trim()==='') delete S.manual[a+'|'+b]; else if (!isNaN(+v)) S.manual[a+'|'+b] = +v;
  save(); render();
}

let busy = false;
async function ensureTimes(force){
  if (busy) return; const p = plan();
  if (!S.key) { toast('설정에서 티맵 연결 키를 먼저 넣어 주세요'); return false; }
  busy = true;
  const bar = $('#barActions'); const old = bar.innerHTML;
  try {
    bar.innerHTML = `<div class="btn grow" style="text-align:center"><span class="spin"></span> 티맵에서 시간 받는 중…</div>`;
    await fillMatrix(p, force, (n,t)=>{ bar.innerHTML = `<div class="btn grow" style="text-align:center"><span class="spin"></span> 티맵에서 시간 받는 중… ${n}/${t}</div>`; });
    await refineOrder(p);
    return true;
  } catch(e) { toast('시간을 받지 못했어요: '+e.message, 4000); return false; }
  finally { busy=false; render(); }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-tab]'); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; render(); window.scrollTo(0,0); return; }
  const p = plan(), i = +t.dataset.i, act = t.dataset.act;
  if (act==='up' && i>0) { [p.stops[i-1],p.stops[i]]=[p.stops[i],p.stops[i-1]]; save(); render(); }
  else if (act==='down' && i<p.stops.length-1) { [p.stops[i+1],p.stops[i]]=[p.stops[i],p.stops[i+1]]; save(); render(); }
  else if (act==='delStop') { if (confirm(`‘${pname(p.stops[i].placeId)}’을(를) 이 동선에서 뺄까요?`)) { p.stops.splice(i,1); save(); render(); } }
  else if (act==='editStop') editStop(i,false);
  else if (act==='addStop') { if (isDraft()) addDestination(); else editStop(null,true); }
  else if (act==='findRoute') await findRoute();
  else if (act==='newDraft') startDraft();
  else if (act==='custFav') { const f = S.dv.fav = S.dv.fav || []; const id = t.dataset.id; const i = f.indexOf(id); if (i>=0) f.splice(i,1); else f.push(id); save(); render(); }
  else if (act==='custInfo') custInfo(t.dataset.id);
  else if (act==='custFilter') { S.dv.cfilter = t.dataset.v; save(); render(); }
  else if (act==='dvPass') { const v = $('#dvPass').value.trim(); if (!v) return; S.dv.pass = v; DV.msg=''; save(); $('#main').innerHTML='<div class="empty"><span class="spin"></span> 확인 중…</div>'; await dvLoad(); render(); if (S.dv.data) toast('배송 자료를 불러왔어요'); }
  else if (act==='dvReload') { $('#main').innerHTML='<div class="empty"><span class="spin"></span> 불러오는 중…</div>'; await dvLoad(); render(); toast(DV.state==='ok'?'최신 자료로 바꿨어요 ('+S.dv.data.updated+')':(DV.msg||'불러오지 못했어요')); }
  else if (act==='dvPrev' || act==='dvNext') { S.dv.date = addDays(S.dv.date||todayStr(), act==='dvPrev'?-1:1); save(); render(); }
  else if (act==='setWho') { e.preventDefault(); const v = prompt('이 기기 이름 (예: 출고장 태블릿, 김기사 폰, 사무실)', S.dv.who||''); if (v!==null) { S.dv.who = v.trim(); save(); render(); } }
  else if (act==='bdDone') { const D = S.dv.date||todayStr(); const k = t.dataset.k; const cur = S.dv.chk[D]?.done?.[k];
    if (!S.dv.who) { const v = prompt('누가 적재했는지 남기려면 이 기기 이름을 정해 주세요 (예: 출고장 태블릿)', ''); if (v) { S.dv.who = v.trim(); save(); } }
    chkSet(D, ['done', k], cur ? null : {t: new Date().toTimeString().slice(0,5), by: S.dv.who||''}); render(); }
  else if (act==='dvMake') { const D = S.dv.date||todayStr(); await syncPull(D, true); if (dvPlans(D).length) { render(); toast('다른 기기에서 이미 만든 코스를 불러왔어요'); return; } S.dv.sig[D] = '__new'; const n = dvMakeDefault(D); save(); render(); toast(n?`기본 코스를 만들었어요 (${n}곳)`:'빈 코스를 만들었어요. 아래에서 업체를 넣어 주세요'); }
  else if (act==='dvOpen') { S.cur = t.dataset.id; S.viewDraft = false; tab='plan'; save(); render(); window.scrollTo(0,0); }
  else if (act==='dvBack') { tab='delivery'; S.dv.date = p.dvDate || S.dv.date; save(); render(); window.scrollTo(0,0); }
  else if (act==='dvTpl') { const dp = S.plans.find(x=>x.id===t.dataset.id); const wd = String(wdOf(dp.dvDate));
    S.dv.tpl = S.dv.tpl || {}; const cur = dvTpl(wd).map(r=>({run:r.run, ids:r.ids.slice()}));
    const runs = dvPlans(dp.dvDate).map(x=>({run:x.run, ids:x.stops.map(s=>s.placeId)}));
    S.dv.tpl[wd] = runs.length ? runs : cur; save(); syncPut('tpl', S.dv.tpl); toast(`${WD[wdOf(dp.dvDate)]}요일 기본 코스로 저장했어요 (다음 주부터 이 순서로 만들어져요)`, 4000); }
  else if (act==='dvRename') { const dp = S.plans.find(x=>x.id===t.dataset.id); const v = prompt('코스 이름 (예: 오전, 오후, 2차)', dp.run); if (v) { dp.run = v.trim(); dp.title = `${md(dp.dvDate)} ${dp.run} 배송`; save(); render(); } }
  else if (act==='dvDel') { const dp = S.plans.find(x=>x.id===t.dataset.id); if (confirm(`${dp.run} 코스를 삭제할까요?`)) { S.plans = S.plans.filter(x=>x.id!==dp.id); if (S.cur===dp.id) S.cur = S.plans[0]?.id||''; save(); render(); } }
  else if (act==='dvAddRun') { const D = S.dv.date||todayStr(); const v = prompt('새 코스 이름 (예: 오후, 2차)', '오후'); if (v) { if (S.dv.sig[D]===undefined) S.dv.sig[D]='__new'; newDvPlan(D, v.trim(), []); save(); render(); } }
  else if (act==='dvAddPlace') dvAddPlace(t.dataset.pid, S.dv.date||todayStr());
  else if (act==='dvReg') dvRegister(t.dataset.cust, S.dv.date||todayStr());
  else if (act==='saveDraft') saveDraft();
  else if (act==='closeDraft') closeDraft();
  else if (act==='pickStart') pickPlace('출발지 고르기', async id=>{ p.startId=id; if(isDraft()) p.searched=false; save(); render(); if(S.key && p.stops.length) await (isDraft()?findRoute():ensureTimes(false)); }, true);
  else if (act==='pickEnd') {
    openSheet(`<h2>도착 방법</h2><button class="btn" style="width:100%;margin-bottom:8px" id="sameEnd">출발지로 돌아오기 (왕복)</button><button class="btn" style="width:100%;margin-bottom:8px" id="oneEnd">마지막 목적지에서 끝 (편도)</button><button class="btn ghost" style="width:100%" id="otherEnd">다른 곳에서 마치기</button>`);
    const after = async () => { if (isDraft()) p.searched=false; save(); closeSheet(); render(); if (S.key && p.stops.length) await (isDraft()?findRoute():ensureTimes(false)); };
    $('#sameEnd').onclick=()=>{ p.endId=''; p.oneWay=false; after(); };
    $('#oneEnd').onclick=()=>{ p.endId=''; p.oneWay=true; after(); };
    $('#otherEnd').onclick=()=>pickPlace('도착지 고르기', async id=>{ p.endId=id===p.startId?'':id; p.oneWay=false; after(); });
  }
  else if (act==='editLeg') editLeg(t.dataset.a, t.dataset.b);
  else if (act==='optimize') await doOptimize(false);
  else if (act==='refresh') { const ok = await ensureTimes(true); if (ok) toast('티맵 시간으로 새로 계산했어요'); }
  else if (act==='newPlace') editPlace(null);
  else if (act==='editPlace') editPlace(t.dataset.id);
  else if (act==='saveKey') {
    S.key = $('#keyInp').value.trim(); save();
    if (!S.key) { toast('키를 붙여넣어 주세요'); return; }
    t.disabled = true; t.innerHTML = '<span class="spin"></span> 확인 중…';
    try { await tmapFetch(`/pois?version=1&count=1&searchKeyword=${encodeURIComponent('광주시청')}`, {headers:{'Content-Type':'text/plain'}}); toast('티맵 연결 완료!'); }
    catch(err){ toast('연결이 안 돼요. 키를 다시 확인해 주세요 ('+err.message+')', 4500); }
    render();
  }
  else if (act==='clearKey') { if (confirm('키를 지울까요?')) { S.key=''; save(); render(); } }
  else if (act==='routeOpt') { S.routeOpt = t.dataset.v; S.cache = {}; save(); render(); toast('기준을 바꾸었어요. 동선 화면에서 시간을 새로 받아 주세요'); }
  else if (act==='export') {
    const data = {...S, key:'', draft:null, viewDraft:false};
    const blob = new Blob([JSON.stringify(data,null,1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `내동선_백업_${todayStr()}.json`; a.click();
    toast('백업 파일을 저장했어요 (키는 빼고 저장)');
  }
  else if (act==='import') $('#impFile').click();
  else if (act==='reset') { if (confirm('정말 처음 상태로 되돌릴까요? 지금 데이터는 모두 지워져요.')) { const k=S.key; S=seed(); S.key=k; save(); tab='plan'; render(); } }
});

async function doOptimize(quiet){
  const p = plan();
  {
    if (p.stops.filter(s=>!s.lock).length < 2) { toast('순서를 바꿀 수 있는 곳이 2곳 이상이어야 해요'); return; }
    let sc0 = schedule(p,p.stops);
    const missingAny = (() => { const ids=[p.startId,endIdOf(p),...p.stops.map(s=>s.placeId)]; for(const a of ids) for(const b of ids) if(a!==b && !legInfo(a,b) && !(b===p.startId&&p.endId)) return true; return false; })();
    if (missingAny) { if (!S.key) { toast('시간을 모르는 구간이 있어요. 키를 넣거나 구간 시간을 직접 입력해 주세요', 4000); return; } await ensureTimes(false); }
    sc0 = schedule(p,p.stops);
    const best = bestOrder(p);
    if (!best) { const noLL = [p.startId, ...p.stops.map(s=>s.placeId)].filter(id=>!place(id)?.lat).map(pname); toast(noLL.length ? `주소(위치)가 없는 곳이 있어요: ${noLL.join(', ')}. 장소 탭에서 주소를 넣거나 구간 시간을 직접 입력해 주세요` : '계산할 수 없어요. 구간 시간을 확인해 주세요', 5000); return; }
    const diff = sc0.missing ? 0 : Math.round(sc0.total - best.sc.total);
    p.stops = best.order; save();
    if (S.key) await ensureTimes(false); else render();
    const after = schedule(p,p.stops);
    if (!quiet) toast(diff>0 ? `최적 순서로 바꿨어요. ${diff}분 줄었어요 (복귀 ${min2hm(after.end)})` : `지금 순서가 가장 빨라요 (복귀 ${min2hm(after.end)})`, 4000);
  }
}

    openSheet(`<h2>새 길찾기</h2>
      <button class="btn primary" style="width:100%;margin-bottom:8px" id="dSave">동선으로 저장</button>
      <button class="btn danger" style="width:100%;margin-bottom:8px" id="dClose">저장하지 않고 닫기</button>
      <button class="btn ghost" style="width:100%" id="mClose">취소</button>`);
    $('#mClose').onclick = closeSheet; $('#dSave').onclick = () => { closeSheet(); saveDraft(); }; $('#dClose').onclick = closeDraft;
    return;
  }
  const p = plan();
  if (!p) { startDraft(); return; }
  openSheet(`<h2>동선 관리</h2>
    <button class="btn" style="width:100%;margin-bottom:8px" id="mNew">＋ 새 길찾기 (목적지부터)</button>
    <button class="btn ghost" style="width:100%;margin-bottom:8px" id="mCopy">지금 동선 복사하기</button>
    <button class="btn ghost" style="width:100%;margin-bottom:8px" id="mRename">이름 바꾸기</button>
    <button class="btn danger" style="width:100%;margin-bottom:8px" id="mDel">지금 동선 삭제</button>
    <button class="btn ghost" style="width:100%" id="mClose">닫기</button>`);
  $('#mClose').onclick = closeSheet;
  $('#mNew').onclick = () => { closeSheet(); startDraft(); };
  $('#mCopy').onclick = () => { const np = JSON.parse(JSON.stringify(p)); np.id=uid(); np.title=p.title+' (복사)'; np.date=todayStr(); np.stops.forEach(s=>s.id=uid()); S.plans.push(np); S.cur=np.id; save(); closeSheet(); render(); toast('복사했어요'); };
  $('#mRename').onclick = () => { const title = prompt('동선 이름', p.title); if(title){ p.title=title; save(); closeSheet(); render(); } };
  $('#mDel').onclick = () => { if (confirm(`‘${p.title}’ 동선을 삭제할까요?`)) { S.plans = S.plans.filter(x=>x.id!==p.id); S.cur=S.plans[0]?.id||''; discardTempPlaces(); save(); closeSheet(); render(); } };
};

render();
if (S.dv.pass) dvLoad().then(() => { if (tab==='delivery') render(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
